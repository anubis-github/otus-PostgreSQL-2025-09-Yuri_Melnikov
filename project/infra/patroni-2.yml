scope: patroni
namespace: /db/
name: patroni02
restapi:
  listen: 10.129.0.7:8008
  connect_address: 10.129.0.7:8008
etcd:
  protocol: http
  hosts: otus-prj-1:2379, otus-prj-2:2379, otus-prj-3:2379
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
  postgresql:
    use_pg_rewind: true
    parameters:
      autovacuum_analyze_scale_factor: 0.01
  initdb:
    - encoding: UTF8
  pg_hba:
    - host replication replicator 127.0.0.1/8 scram-sha-256 # localhost
    - host replication replicator 10.129.0.32/32 scram-sha-256 # initial PG master node
    - host replication replicator 10.129.0.7/32 scram-sha-256 # initial PG replica-1 node
    - host all all 0.0.0.0/0 scram-sha-256
  users:
    admin:
      password: admin # user admin password for Patroni cluster
      options:
        - createrole
        - createdb

postgresql:
  listen:
    127.0.0.1,10.129.0.7:5432 # localhost & this PG node IPs
  connect_address:
    10.129.0.7:5432 # this PG node IP
  data_dir:
    /var/lib/postgresql/18/main
  bin_dir:
    /usr/lib/postgresql/18/bin
  config_dir:
    /etc/postgresql/18/main
  authentication:
    replication:
      username: replicator
      password: replicator
    superuser:
      username: postgres
      password: postgres
    rewind:
      username: postgres
      password: postgres
  parameters:
    unix_socket_directories: '.'
tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false