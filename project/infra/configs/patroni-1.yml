scope: patroni
namespace: /db/
name: patroni01
restapi:
  listen: 0.0.0.0:8008
  connect_address: 10.129.0.23:8008 # parameter
etcd:
  protocol: http
  hosts:
    - otus-prj-1:2379
    - otus-prj-2:2379
    - otus-prj-3:2379
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        autovacuum_analyze_scale_factor: 0.01
  initdb:
    - encoding: UTF8
  users:
    admin:
      password: admin # user admin password for Patroni cluster
      options:
        - createrole
        - createdb

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.129.0.23:5432 # this PG node IP
  data_dir: /var/lib/postgresql/18/main
  bin_dir: /usr/lib/postgresql/18/bin
  config_dir: /etc/postgresql/18/main
  pgpass: /tmp/pgpass1
  pg_hba:
    - local all all trust
    - host all all 0.0.0.0/0 md5
    - host all all ::1/128 trust
    - host all all 127.0.0.1/32 trust
    - host replication replicator 10.129.0.0/24 md5
    - host replication replicator 127.0.0.1/32 trust
    - host replication replicator ::1/128 trust

  authentication:
    replication:
      username: replicator
      password: replicator
    superuser:
      username: postgres
      password: postgres
    rewind:
      username: postgres
      password: postgres
#  parameters:
#    unix_socket_directories: '.'
tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
